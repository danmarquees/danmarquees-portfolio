<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dan Marques - Full Stack Developer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Fraunces:ital,opsz,wght@0,9..144,100;0,9..144,300;0,9..144,400;1,9..144,300&display=swap"
    rel="stylesheet">
  <script>
    let storedTheme;
    let storedLanguage;
    try {
      storedTheme = localStorage.getItem('portfolio-theme');
      storedLanguage = localStorage.getItem('portfolio-language');
    } catch (error) {
      storedTheme = null;
      storedLanguage = null;
    }
    const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.dataset.theme = storedTheme || (systemPrefersDark ? 'dark' : 'light');
    document.documentElement.lang = storedLanguage || 'en';
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
