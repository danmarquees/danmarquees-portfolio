<head>

  <!-- Primary Meta Tags -->

  <meta name="author" content="Dan Marques" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://danmarques.dev/" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://danmarques.dev/" />
  <meta property="og:title" content="Dan Marques — Full Stack Developer" />
  <meta property="og:description" content="Full Stack Developer from São Paulo, Brazil. Building digital experiences at the intersection of code, craft and creativity." />
  <meta property="og:image" content="https://danmarques.dev/og-image.png" />
  <meta property="og:locale" content="en_US" />
  <meta property="og:locale:alternate" content="pt_BR" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:url" content="https://danmarques.dev/" />
  <meta name="twitter:title" content="Dan Marques — Full Stack Developer" />
  <meta name="twitter:description" content="Full Stack Developer from São Paulo, Brazil. Building digital experiences at the intersection of code, craft and creativity." />
  <meta name="twitter:image" content="https://danmarques.dev/og-image.png" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Fraunces:ital,opsz,wght@0,9..144,100;0,9..144,300;0,9..144,400;1,9..144,300&display=swap"
    rel="stylesheet">

  <!-- Blocking script: apply theme/language before first paint to prevent flash -->
  <script>
    let storedTheme;
    let storedLanguage;
    try {
      storedTheme = localStorage.getItem('portfolio-theme');
      storedLanguage = localStorage.getItem('portfolio-language');
    } catch (error) {
      storedTheme = null;
      storedLanguage = null;
    }
    const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.dataset.theme = storedTheme || (systemPrefersDark ? 'dark' : 'light');
    document.documentElement.lang = storedLanguage || 'en';
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
